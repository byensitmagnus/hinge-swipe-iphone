[package]
name = "hinge-auto-swipe"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
hinge-rs = { version = "0.2.0", default-features = false, features = ["native-tls"] }
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "time", "macros"] }
